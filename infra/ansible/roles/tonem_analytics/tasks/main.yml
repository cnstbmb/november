- name: Validate Tonem analytics private configuration
  ansible.builtin.assert:
    that:
      - repo_root is defined
      - repo_root | length > 0
      - tonem_analytics_postgres_password | length >= 20
      - tonem_analytics_database_url is match('^postgresql://')
      - tonem_analytics_app_secret | length >= 32
      - (not (tonem_analytics_restic_enabled | bool)) or ((backup_target | default('')) | length > 0)
    fail_msg: "Set Umami database/app secrets in private Ansible inventory. Use a URL-encoded password in DATABASE_URL. The website UUID may stay empty for the initial bootstrap."
  no_log: true

- name: Ensure Tonem analytics and backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ tonem_analytics_dir }}"
    - "{{ tonem_analytics_backup_root }}"
    - "{{ tonem_analytics_textfile_dir }}"
  when: not ansible_check_mode

- name: Copy pinned Tonem analytics compose file
  ansible.builtin.copy:
    src: "{{ repo_root }}/deployments/tonem-analytics/docker-compose.yml"
    dest: "{{ tonem_analytics_dir }}/docker-compose.yml"
    mode: "0644"

- name: Render private Umami environment
  ansible.builtin.template:
    src: umami.env.j2
    dest: "{{ tonem_analytics_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Render production analytics runtime config for Tonem web
  ansible.builtin.template:
    src: analytics-config.js.j2
    dest: /opt/tonem/analytics-config.js
    mode: "0644"

- name: Pull Tonem analytics images
  ansible.builtin.command: docker compose pull --policy always
  args:
    chdir: "{{ tonem_analytics_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Start Tonem analytics stack
  ansible.builtin.command: docker compose up -d --remove-orphans --force-recreate --pull never
  args:
    chdir: "{{ tonem_analytics_dir }}"
  when: not ansible_check_mode

- name: Verify private Umami heartbeat
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tonem_analytics_admin_port }}/api/heartbeat"
    status_code: 200
  register: tonem_analytics_heartbeat
  retries: 18
  delay: 10
  until: tonem_analytics_heartbeat.status == 200
  when: not ansible_check_mode

- name: Render Tonem analytics retention SQL
  ansible.builtin.template:
    src: tonem-analytics-retention.sql.j2
    dest: "{{ tonem_analytics_dir }}/tonem-analytics-retention.sql"
    mode: "0600"

- name: Render Tonem analytics maintenance scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0750"
  loop:
    - src: tonem-analytics-retention.sh.j2
      dest: /usr/local/bin/tonem-analytics-retention
    - src: tonem-analytics-backup.sh.j2
      dest: /usr/local/bin/tonem-analytics-backup
  no_log: true

- name: Render Tonem analytics restore-check script
  ansible.builtin.template:
    src: tonem-analytics-restore-check.sh.j2
    dest: /usr/local/bin/tonem-analytics-restore-check
    mode: "0750"
  when: tonem_analytics_restore_check_enabled | bool

- name: Render Tonem analytics systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - tonem-analytics-retention.service
    - tonem-analytics-retention.timer
    - tonem-analytics-backup.service
    - tonem-analytics-backup.timer

- name: Render Tonem analytics restore-check systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - tonem-analytics-restore-check.service
    - tonem-analytics-restore-check.timer
  when: tonem_analytics_restore_check_enabled | bool

- name: Enable Tonem analytics maintenance timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - tonem-analytics-retention.timer
    - tonem-analytics-backup.timer
  when: not ansible_check_mode

- name: Enable Tonem analytics restore-check timer
  ansible.builtin.systemd_service:
    name: tonem-analytics-restore-check.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - tonem_analytics_restore_check_enabled | bool
    - not ansible_check_mode
