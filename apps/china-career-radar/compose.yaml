services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    volumes:
      - radar-postgres-v18:/var/lib/postgresql
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      {
        context: ../..,
        dockerfile: apps/china-career-radar/Dockerfile,
        target: build,
      }
    environment:
      DATABASE_URL: postgres://radar:radar@postgres:5432/radar
    depends_on:
      postgres: { condition: service_healthy }
    command: ["npm", "run", "db:migrate"]
  app:
    build: { context: ../.., dockerfile: apps/china-career-radar/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://radar:radar@postgres:5432/radar
      WORKER_LOCATION: dc
      RADAR_CONFIG_DIR: /app/config
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  radar-postgres-v18:
