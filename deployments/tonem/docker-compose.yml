# tonem.ru — self-contained Docker Compose stack.
#
# Services:
#   tonem-postgres  — dedicated Postgres database for tonem
#   tonem-server    — NestJS quote collector + read API
#   tonem-web       — nginx static SPA for tonem.ru / www.tonem.ru
#
# The stack joins remnawave-network so the existing remnawave-panel-proxy
# nginx (which already binds host ports 80/443) can proxy_pass to
# tonem-web and tonem-server by container name.

services:
  # ── tonem-postgres ──────────────────────────────────────────────────────────
  tonem-postgres:
    image: postgres:17-alpine
    container_name: tonem-postgres
    restart: always
    environment:
      POSTGRES_USER: tonem
      POSTGRES_PASSWORD: ${TONEM_POSTGRES_PASSWORD}
      POSTGRES_DB: tonem
    volumes:
      - tonem-pg-data:/var/lib/postgresql/data
    networks:
      - tonem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonem -d tonem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── tonem-server ────────────────────────────────────────────────────────────
  tonem-server:
    image: cnstbmb/tonem-server:latest
    container_name: tonem-server
    restart: always
    env_file:
      - .env
    networks:
      - tonem-network
      - remnawave-network
    depends_on:
      tonem-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── tonem-web (frontend) ────────────────────────────────────────────────────
  tonem-web:
    image: cnstbmb/tonem-web:latest
    container_name: tonem-web
    restart: always
    networks:
      - remnawave-network
    volumes:
      - ./analytics-config.js:/usr/share/nginx/html/analytics-config.js:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  tonem-network:
    driver: bridge
    name: tonem-network
  remnawave-network:
    external: true
    name: remnawave-network

volumes:
  tonem-pg-data:
