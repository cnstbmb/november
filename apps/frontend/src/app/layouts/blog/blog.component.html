<div class="overflow-auto" infiniteScroll (scrolled)="onScrollDown()" (scrolledUp)="onScrollUp()">
  @for (post of posts$ | async; track post) {
    <app-post [postData]="$any(post)" (deletePost)="onDeletePost(post)"></app-post>
  }
</div>

<p-confirmdialog
  [style]="{ width: '33vw' }"
  [baseZIndex]="10000"
  rejectButtonStyleClass="p-button-outlined"
></p-confirmdialog>
