<app-canvas-background>
  <div
    class="select-none h-screen w-screen flex flex-column sm:flex-row align-content-center align-self-center align-items-center justify-content-center"
  >
    @for (linkData of socialLinks; track linkData) {
      <div class="sm:mr-4 mb-2">
        <a [href]="linkData.href"
          ><img class="md:w-9rem w-4rem" [src]="linkData.imgPath" [alt]="linkData.imgAlt"
        /></a>
      </div>
    }
  </div>
</app-canvas-background>
