- name: Ensure monitoring agent directory exists
  ansible.builtin.file:
    path: "{{ monitoring_agent_dir }}"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: Render monitoring agent configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: docker-compose.yml.j2
      dest: "{{ monitoring_agent_dir }}/docker-compose.yml"
    - src: promtail-config.yml.j2
      dest: "{{ monitoring_agent_dir }}/promtail-config.yml"
    - src: alloy-config.alloy.j2
      dest: "{{ monitoring_agent_dir }}/alloy-config.alloy"
  when: not ansible_check_mode

- name: Validate Grafana Alloy configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ monitoring_agent_dir }}/alloy-config.alloy:/etc/alloy/config.alloy:ro"
      - "{{ monitoring_alloy_image }}"
      - validate
      - /etc/alloy/config.alloy
  changed_when: false
  when:
    - not ansible_check_mode
    - monitoring_log_collector == 'alloy'

- name: Remove legacy fixed-name monitoring containers
  ansible.builtin.command: docker rm -f {{ item }}
  loop:
    - monitoring-node-exporter
    - monitoring-promtail
    - monitoring-alloy
  register: monitoring_agent_legacy_cleanup
  failed_when: false
  changed_when: monitoring_agent_legacy_cleanup.rc == 0
  when: not ansible_check_mode

- name: Start monitoring agent stack
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ monitoring_agent_dir }}"
  when: not ansible_check_mode
