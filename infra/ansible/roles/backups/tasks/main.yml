- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: Ensure backup target is external
  ansible.builtin.assert:
    that:
      - backup_target is match(backup_external_target_regex)
    fail_msg: >-
      backup_target must point to external storage (for example s3:https://endpoint/bucket
      or /mnt/...).
      Current value: {{ backup_target }}
  when: backup_require_external_target | bool

- name: Ensure restic config directory exists
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"

- name: Write restic credentials
  ansible.builtin.copy:
    dest: /etc/restic/credentials
    content: "{{ backup_password }}"
    mode: "0600"
  no_log: true

- name: Check restic repository config
  ansible.builtin.command: restic cat config
  register: restic_repo_config
  changed_when: false
  failed_when: false
  environment: >-
    {{
      {
        'RESTIC_REPOSITORY': backup_target,
        'RESTIC_PASSWORD_FILE': '/etc/restic/credentials'
      } | combine(backup_env | default({}))
    }}
  when: not ansible_check_mode

- name: Determine whether restic repository needs initialization
  ansible.builtin.set_fact:
    restic_repository_missing: >-
      {{
        (restic_repo_config.rc | int != 0) and
        (
          (restic_repo_config.stderr | default('') | lower) is search('is there a repository') or
          (restic_repo_config.stderr | default('') | lower) is search('unable to open config file') or
          (restic_repo_config.stderr | default('') | lower) is search('config file does not exist') or
          (restic_repo_config.stderr | default('') | lower) is search('specified key does not exist')
        )
      }}
  when: not ansible_check_mode

- name: Fail when restic repository check returned unexpected error
  ansible.builtin.assert:
    that:
      - restic_repo_config.rc | int == 0 or restic_repository_missing | bool
    fail_msg: >-
      Restic repository check failed with an unexpected error.
      stdout={{ restic_repo_config.stdout | default('') }}
      stderr={{ restic_repo_config.stderr | default('') }}
  when: not ansible_check_mode

- name: Initialize restic repository
  ansible.builtin.command: restic init
  register: restic_init
  when:
    - not ansible_check_mode
    - restic_repository_missing | bool
    - backup_initialize_repository | bool
  changed_when: restic_init.rc == 0
  failed_when: >-
    restic_init.rc != 0 and
    ('already initialized' not in (restic_init.stderr | default('') | lower))
  environment: >-
    {{
      {
        'RESTIC_REPOSITORY': backup_target,
        'RESTIC_PASSWORD_FILE': '/etc/restic/credentials'
      } | combine(backup_env | default({}))
    }}

- name: Refuse to initialize a missing Restic repository
  ansible.builtin.assert:
    that:
      - not (restic_repository_missing | bool)
    fail_msg: >-
      The configured Restic repository is not accessible from this host and
      backup_initialize_repository is false. Refusing to create a replacement
      repository; verify the external mount or backend credentials.
  when:
    - not ansible_check_mode
    - not (backup_initialize_repository | bool)

- name: Install backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup.sh
    mode: "0750"

- name: Ensure backup prepare directory exists
  ansible.builtin.file:
    path: "{{ backup_prepare_dir }}"
    state: directory
    mode: "0700"
  when:
    - backup_remnawave_pg_dump_enabled | bool

- name: Ensure Tonem backup and metrics directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ backup_tonem_prepare_dir }}"
    - "{{ backup_tonem_textfile_dir }}"
  when:
    - backup_tonem_pg_dump_enabled | bool

- name: Ensure monitoring snapshot directory exists
  ansible.builtin.file:
    path: "{{ backup_monitoring_prepare_dir }}"
    state: directory
    mode: "0700"
  when:
    - backup_monitoring_snapshot_enabled | bool

- name: Install backup prepare script
  ansible.builtin.template:
    src: restic-backup-prepare.sh.j2
    dest: /usr/local/bin/restic-backup-prepare.sh
    mode: "0750"

- name: Schedule backup cron
  ansible.builtin.cron:
    name: "restic-backup"
    minute: "{{ backup_cron_minute }}"
    hour: "{{ backup_cron_hour }}"
    day: "{{ backup_cron_day }}"
    month: "{{ backup_cron_month }}"
    weekday: "{{ backup_cron_weekday }}"
    job: "/usr/local/bin/restic-backup.sh"

- name: Remove legacy standalone Tonem backup cron after master backup integration
  ansible.builtin.cron:
    name: "tonem-backup"
    state: absent
  when:
    - backup_tonem_pg_dump_enabled | bool

- name: Install Tonem isolated restore-check script
  ansible.builtin.template:
    src: tonem-restore-check.sh.j2
    dest: /usr/local/bin/tonem-restore-check
    mode: "0750"
  when:
    - backup_tonem_restore_check_enabled | bool

- name: Install Tonem restore-check systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - tonem-restore-check.service
    - tonem-restore-check.timer
  when:
    - backup_tonem_restore_check_enabled | bool

- name: Enable monthly Tonem restore-check timer
  ansible.builtin.systemd_service:
    name: tonem-restore-check.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - not ansible_check_mode
    - backup_tonem_restore_check_enabled | bool
