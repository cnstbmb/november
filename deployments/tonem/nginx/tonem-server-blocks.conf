# Ephemeral per-IP counters exist only in nginx shared memory and are never logged.
limit_req_zone $binary_remote_addr zone=tonem_ingest:10m rate=30r/m;

# ── tonem.ru / www.tonem.ru (static SPA) ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tonem.ru www.tonem.ru;
    access_log off;

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tonem.ru www.tonem.ru;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/tonem.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonem.ru/privkey.pem;

    ssl_buffer_size 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    # Umami UI/admin APIs are intentionally not exposed. Only the tracker and
    # bounded ingestion endpoints are reachable from the public site.
    location = /analytics/script.js {
        set $tonem_umami_upstream tonem-umami:3000;
        proxy_pass http://$tonem_umami_upstream/script.js;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /analytics/api/send {
        client_max_body_size 16k;
        limit_req zone=tonem_ingest burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        set $tonem_server_upstream tonem-server:3200;
        proxy_pass http://$tonem_server_upstream/analytics-ingest/send;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Umami-Cache $http_x_umami_cache;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
    }

    location = /analytics/api/batch {
        client_max_body_size 32k;
        limit_req zone=tonem_ingest burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        set $tonem_server_upstream tonem-server:3200;
        proxy_pass http://$tonem_server_upstream/analytics-ingest/batch;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Umami-Cache $http_x_umami_cache;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
    }

    location = /client-telemetry {
        client_max_body_size 8k;
        limit_req zone=tonem_ingest burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        set $tonem_server_upstream tonem-server:3200;
        proxy_pass http://$tonem_server_upstream/client-telemetry;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3s;
        proxy_connect_timeout 2s;
        proxy_next_upstream off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        set $tonem_web_upstream tonem-web:80;
        proxy_pass http://$tonem_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}

# ── api.tonem.ru (NestJS read API) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.tonem.ru;
    access_log off;

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tonem.ru;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/api.tonem.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tonem.ru/privkey.pem;

    ssl_buffer_size 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Prometheus scrapes this endpoint over the private Docker network only.
    location = /metrics {
        return 404;
    }

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    location ~ ^/(?:latest|at|range|live|ready|health)$ {
        set $tonem_server_upstream tonem-server:3200;
        proxy_pass http://$tonem_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location / {
        return 404;
    }
}
