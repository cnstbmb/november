# tonem.ru — self-contained Docker Compose stack.
#
# Services:
#   tonem-postgres  — dedicated Postgres database for tonem
#   tonem-server    — NestJS quote collector + read API (port 3200)
#   tonem-web       — nginx static SPA for tonem.ru / www.tonem.ru (port 80)
#
# The stack is independent of the prod compose except for one shared network:
#   - app-network (external) — tonem-web + tonem-server join it so the prod
#     nginx (`webserver`) can proxy_pass to them by container name.
#   - tonem-network (internal) — private bridge for tonem-server ↔ tonem-postgres.
#
# The tonem-server container publishes 3200 on the host (127.0.0.1) for optional
# direct access. The tonem-web container does NOT publish a host port — it is
# reached exclusively by the prod nginx over app-network.

services:
  # ── tonem-postgres ──────────────────────────────────────────────────────────
  tonem-postgres:
    image: postgres:17-alpine
    container_name: tonem-postgres
    restart: always
    environment:
      POSTGRES_USER: tonem
      POSTGRES_PASSWORD: ${TONEM_POSTGRES_PASSWORD}
      POSTGRES_DB: tonem
    volumes:
      - tonem-pg-data:/var/lib/postgresql/data
    networks:
      - tonem-network   # private — DB is not exposed to the prod shared network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonem -d tonem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── tonem-server ────────────────────────────────────────────────────────────
  tonem-server:
    image: cnstbmb/tonem-server:latest
    container_name: tonem-server
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3200:3200"   # only loopback — prod nginx proxies via app-network
    networks:
      - tonem-network            # DB access
      - app-network              # reachable by prod nginx (`webserver`)
    depends_on:
      tonem-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/latest || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── tonem-web (frontend) ────────────────────────────────────────────────────
  tonem-web:
    image: cnstbmb/tonem-web:latest
    container_name: tonem-web
    restart: always
    networks:
      - app-network              # reachable by prod nginx (`webserver`)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  tonem-network:
    driver: bridge              # private: tonem-server ↔ tonem-postgres
  app-network:
    external: true              # created by deployments/prod/docker-compose.yml
    name: app-network

volumes:
  tonem-pg-data:                # persistent Postgres data
