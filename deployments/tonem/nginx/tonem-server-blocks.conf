# ── tonem.ru / www.tonem.ru (static SPA) ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tonem.ru www.tonem.ru;

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tonem.ru www.tonem.ru;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tonem.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonem.ru/privkey.pem;

    ssl_buffer_size 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /.well-known/acme-challenge {
        root /var/www/html;
        allow all;
    }

    location / {
        set $tonem_web_upstream tonem-web:80;
        proxy_pass http://$tonem_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}

# ── api.tonem.ru (NestJS read API) ────────────────────────────────────────
