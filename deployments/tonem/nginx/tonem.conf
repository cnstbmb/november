# tonem.ru — static SPA (Angular) site config for the tonem-web container.
# Serves the built app from /usr/share/nginx/html with SPA fallback and
# cache headers tuned for Angular's content-hashed bundles.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── index.html: never cache (it references hashed bundles by name) ──────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Content-hashed assets: immutable, cache forever ─────────────────────
    # Angular emits main-<hash>.js / styles-<hash>.css at the root; the
    # production config sets outputHashing: "all", so any file that carries a
    # content hash is safe to cache for a year.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static binary/media assets (fonts, images, icons, og-card) — long cache.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback: everything else serves index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
