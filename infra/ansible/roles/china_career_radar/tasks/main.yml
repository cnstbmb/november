- name: Validate China Career Radar deployment inputs
  ansible.builtin.assert:
    that:
      - repo_root is defined
      - repo_root | length > 0
      - china_career_radar_admin_port | int > 0
      - china_career_radar_analyzer_provider in ['mock', 'deepseek']

- name: Inspect private China Career Radar environment on controller
  ansible.builtin.stat:
    path: "{{ china_career_radar_env_src }}"
  delegate_to: localhost
  become: false
  register: china_career_radar_local_env

- name: Require private China Career Radar environment
  ansible.builtin.assert:
    that:
      - china_career_radar_local_env.stat.exists
      - china_career_radar_local_env.stat.isreg
    fail_msg: "Create apps/china-career-radar/.env on the controller before deployment."

- name: Ensure China Career Radar deployment directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ china_career_radar_dir }}"
    - "{{ china_career_radar_dir }}/source"
    - "{{ china_career_radar_dir }}/source/apps"
    - "{{ china_career_radar_dir }}/source/apps/china-career-radar"

- name: Copy root workspace manifests
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item }}"
    dest: "{{ china_career_radar_dir }}/source/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - package.json
    - package-lock.json

- name: Copy China Career Radar source directories
  ansible.builtin.copy:
    src: "{{ repo_root }}/apps/china-career-radar/{{ item }}/"
    dest: "{{ china_career_radar_dir }}/source/apps/china-career-radar/{{ item }}/"
    owner: root
    group: root
    mode: preserve
  loop:
    - config
    - database
    - src

- name: Copy China Career Radar build manifests
  ansible.builtin.copy:
    src: "{{ repo_root }}/apps/china-career-radar/{{ item }}"
    dest: "{{ china_career_radar_dir }}/source/apps/china-career-radar/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - Dockerfile
    - drizzle.config.ts
    - package.json
    - tsconfig.build.json
    - tsconfig.json

- name: Copy private application environment
  ansible.builtin.copy:
    src: "{{ china_career_radar_env_src }}"
    dest: "{{ china_career_radar_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Inspect database password secret
  ansible.builtin.stat:
    path: "{{ china_career_radar_dir }}/db-password"
  register: china_career_radar_db_password

- name: Generate database password once
  ansible.builtin.command: openssl rand -hex 32
  register: china_career_radar_generated_db_password
  changed_when: true
  no_log: true
  when:
    - not china_career_radar_db_password.stat.exists
    - not ansible_check_mode

- name: Persist generated database password
  ansible.builtin.copy:
    content: "{{ china_career_radar_generated_db_password.stdout }}\n"
    dest: "{{ china_career_radar_dir }}/db-password"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - china_career_radar_generated_db_password is not skipped
    - not ansible_check_mode

- name: Create a node-readable database password secret
  ansible.builtin.copy:
    src: "{{ china_career_radar_dir }}/db-password"
    dest: "{{ china_career_radar_dir }}/db-password-app"
    remote_src: true
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true
  when: not ansible_check_mode

- name: Render private production Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ china_career_radar_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Build China Career Radar images
  ansible.builtin.command: docker compose build app migrate
  args:
    chdir: "{{ china_career_radar_dir }}"
  when: not ansible_check_mode

- name: Start China Career Radar stack
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ china_career_radar_dir }}"
  when: not ansible_check_mode

- name: Verify China Career Radar readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ china_career_radar_admin_port }}/health/ready"
    status_code: 200
    return_content: true
  register: china_career_radar_readiness
  retries: 20
  delay: 3
  until:
    - china_career_radar_readiness.status == 200
    - china_career_radar_readiness.json.status == 'ok'
  when: not ansible_check_mode
